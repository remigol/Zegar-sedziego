name: Android layout before-after API 35
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/android-ui-*']
permissions:
  contents: read
concurrency:
  group: android-layout-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: small
            size: 720x1280
            density: 320
            font: '1.0'
          - profile: small-large-text
            size: 720x1280
            density: 320
            font: '1.3'
          - profile: pixel2
            size: 1080x1920
            density: 420
            font: '1.0'
          - profile: galaxy-s23-ratio
            size: 1080x2340
            density: 420
            font: '1.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare original UI comparison
        run: |
          mkdir -p evidence work/baseline work/apks
          echo "Build or emulator has not completed; see logs." > evidence/report.md
          git rev-parse HEAD > evidence/commit.txt
          echo bec5aa461adfc7db1aea60169db74192cf4a97f1 > evidence/baseline-commit.txt
          git archive bec5aa461adfc7db1aea60169db74192cf4a97f1 | tar -x -C work/baseline
          cp app/build.gradle.kts work/baseline/app/build.gradle.kts
      - name: Validate smoke test syntax
        run: python3 -m py_compile scripts/android_ui_smoke.py
      - name: Build original UI APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p work/baseline :app:assembleDebug --stacktrace --console=plain 2>&1 | tee evidence/gradle-before.log
          cp work/baseline/app/build/outputs/apk/debug/app-debug.apk work/apks/before.apk
      - name: Build corrected UI APK and lint
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:lintDebug --stacktrace --console=plain 2>&1 | tee evidence/gradle-after.log
          cp app/build/outputs/apk/debug/app-debug.apk work/apks/after.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture before and test after on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android_layout_compare.sh ${{ matrix.size }} ${{ matrix.density }} ${{ matrix.font }}
      - name: Publish report summary
        if: always()
        run: cat evidence/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload screenshots, geometry and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-evidence-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/
            app/build/reports/
      - name: Upload both APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-apks-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: work/apks/*.apk
